name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version overriding the checked-in version.
        type: string
        required: false
      dry-run:
        description: Check the release prerequisites without publishing.
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: dblock/ruby-gem-release/.github/workflows/release.yml@af40fdfc7a55a7d0577cacc042b2baf952f64e4f # v0.8.0
    with:
      ruby-version: '3.4'
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
